name: Offline runtime validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'offline/**'
      - 'docs/active-bundle.md'
      - 'docs/snapshots.md'
      - 'docs/command-gate.md'
      - 'docs/lifecycle.md'
      - 'docs/synthetic-plant.md'
      - 'docs/offline-loop.md'
      - '.github/workflows/offline-runtime.yml'

permissions:
  contents: read

jobs:
  integration:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: ZenWang00/semantic-shared-control
          ref: 0a3c169516b79e5056d426ad3eee7613fc0a562e
          path: shared-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build version-pinned wheels
        run: |
          python -m pip wheel --no-deps --wheel-dir dist ./shared-core
          python -m pip wheel --no-deps --wheel-dir dist ./offline
          python -m venv .venv-offline
          .venv-offline/bin/python -m pip install 'dist/ssc_core-0.11.0-py3-none-any.whl[test]'
          .venv-offline/bin/python -m pip install --no-deps dist/ssc_runtime-0.8.0-py3-none-any.whl
      - name: Test installed consumer and candidate context and real solver
        run: |
          .venv-offline/bin/python -m pytest offline/tests --basetemp=test-evidence --junitxml=test-results.xml
          .venv-offline/bin/python -m pip check
          .venv-offline/bin/python -m pip freeze > dependencies.txt
          git rev-parse HEAD > runtime-revision.txt
          git -C shared-core rev-parse HEAD > core-revision.txt
          sha256sum dist/*.whl > wheel-sha256.txt
          cmp offline/tests/fixtures/bottle_cup_candidates_v2.json shared-core/tests/fixtures/shared_control/bottle_cup_candidates_v2.json
      - name: Rerun accepted producer component checks at the installed version pair
        if: ${{ !cancelled() }}
        run: |
          .venv-offline/bin/python -m pytest shared-core/tests/shared_control --junitxml=server-test-results.xml
      - name: Complete loop and fresh-process archive replay
        run: |
          .venv-offline/bin/python -I -m ssc_runtime.runner --core-wheel dist/ssc_core-0.11.0-py3-none-any.whl --runtime-wheel dist/ssc_runtime-0.8.0-py3-none-any.whl --runtime-revision "$(git rev-parse HEAD)" --output integration-evidence
          cmp offline/src/ssc_runtime/data/offline-candidates-v2.md shared-core/docs/wiki/Offline-Candidate-Profile.md
          cmp offline/src/ssc_runtime/data/bottle_cup_candidates_v2.json shared-core/tests/fixtures/shared_control/bottle_cup_candidates_v2.json
      - name: Run one, two and sixteen candidates through the gate and replay
        run: |
          for count in 1 2 16; do
            .venv-offline/bin/python -I -m ssc_runtime.runner --core-wheel dist/ssc_core-0.11.0-py3-none-any.whl --runtime-wheel dist/ssc_runtime-0.8.0-py3-none-any.whl --runtime-revision "$(git rev-parse HEAD)" --candidate-count "$count" --output "integration-count-$count-evidence"
          done
      - name: Retain high, equal, low and alternative candidate runs
        run: |
          for variant in higher-target equal-target lower-target multiple-alternatives joystick-only; do
            .venv-offline/bin/python -I -m ssc_runtime.runner --core-wheel dist/ssc_core-0.11.0-py3-none-any.whl --runtime-wheel dist/ssc_runtime-0.8.0-py3-none-any.whl --runtime-revision "$(git rev-parse HEAD)" --variant "$variant" --output "integration-$variant-evidence"
          done
      - name: Join candidate and runtime acceptance obligations to executed evidence
        if: ${{ !cancelled() }}
        run: |
          .venv-offline/bin/python offline/tools/acceptance_matrix.py --server server-test-results.xml --runtime test-results.xml --output acceptance-matrix.json
      - name: Retain version pair and coordination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-runtime-validation
          path: |
            dist/*.whl
            test-results.xml
            server-test-results.xml
            acceptance-matrix.json
            integration-evidence/**
            integration-*-evidence/**
            test-evidence/**/integration-*.json
            test-evidence/**/concurrency-trace.json
            test-evidence/**/snapshot-trace.json
            test-evidence/**/gate-trace.json
            test-evidence/**/lifecycle-trace.json
            test-evidence/**/plant-trace.json
            dependencies.txt
            runtime-revision.txt
            core-revision.txt
            wheel-sha256.txt
