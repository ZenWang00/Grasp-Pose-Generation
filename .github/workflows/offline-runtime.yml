name: Offline runtime validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'offline/**'
      - 'docs/active-bundle.md'
      - 'docs/snapshots.md'
      - 'docs/command-gate.md'
      - 'docs/lifecycle.md'
      - 'docs/synthetic-plant.md'
      - 'docs/offline-loop.md'
      - '.github/workflows/offline-runtime.yml'

permissions:
  contents: read

jobs:
  integration:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: ZenWang00/semantic-shared-control
          ref: 0d92d78e7340af363e9ed0e3069a820a4ac6e8e8
          path: shared-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build version-pinned wheels
        run: |
          python -m pip wheel --no-deps --wheel-dir dist ./shared-core
          python -m pip wheel --no-deps --wheel-dir dist ./offline
          python -m venv .venv-offline
          .venv-offline/bin/python -m pip install 'dist/ssc_core-0.10.0-py3-none-any.whl[test]'
          .venv-offline/bin/python -m pip install --no-deps dist/ssc_runtime-0.7.0-py3-none-any.whl
      - name: Test installed consumer and real producer receipts
        run: |
          .venv-offline/bin/python -m pytest offline/tests --basetemp=test-evidence --junitxml=test-results.xml
          .venv-offline/bin/python -m pip check
          .venv-offline/bin/python -m pip freeze > dependencies.txt
          git rev-parse HEAD > runtime-revision.txt
          git -C shared-core rev-parse HEAD > core-revision.txt
          sha256sum dist/*.whl > wheel-sha256.txt
          cmp offline/tests/fixtures/bottle_cup_offline_v1.json shared-core/tests/fixtures/shared_control/bottle_cup_offline_v1.json
      - name: Rerun accepted producer component checks at the installed version pair
        if: ${{ !cancelled() }}
        run: |
          .venv-offline/bin/python -m pytest shared-core/tests/shared_control --junitxml=server-test-results.xml
      - name: Complete loop and fresh-process archive replay
        run: |
          .venv-offline/bin/python -I -m ssc_runtime.runner --core-wheel dist/ssc_core-0.10.0-py3-none-any.whl --runtime-wheel dist/ssc_runtime-0.7.0-py3-none-any.whl --runtime-revision "$(git rev-parse HEAD)" --output integration-evidence
          cmp offline/src/ssc_runtime/data/offline-reference-v1.md shared-core/docs/wiki/Offline-Reference-Profile.md
          cmp offline/src/ssc_runtime/data/offline-reference-batch-v2.md shared-core/docs/wiki/Offline-Batch-Profile.md
          cmp offline/src/ssc_runtime/data/bottle_cup_offline_v1.json shared-core/tests/fixtures/shared_control/bottle_cup_offline_v1.json
      - name: Run all sixteen programs through the live gate and replay
        run: |
          .venv-offline/bin/python -I -m ssc_runtime.runner --core-wheel dist/ssc_core-0.10.0-py3-none-any.whl --runtime-wheel dist/ssc_runtime-0.7.0-py3-none-any.whl --runtime-revision "$(git rev-parse HEAD)" --program-count 16 --output integration-16-evidence
      - name: Join all S P G C acceptance obligations to executed evidence
        if: ${{ !cancelled() }}
        run: |
          .venv-offline/bin/python offline/tools/acceptance_matrix.py --server server-test-results.xml --runtime test-results.xml --output acceptance-matrix.json
      - name: Retain version pair and coordination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-runtime-validation
          path: |
            dist/*.whl
            test-results.xml
            server-test-results.xml
            acceptance-matrix.json
            integration-evidence/**
            integration-16-evidence/**
            test-evidence/**/integration-*.json
            test-evidence/**/concurrency-trace.json
            test-evidence/**/snapshot-trace.json
            test-evidence/**/gate-trace.json
            test-evidence/**/lifecycle-trace.json
            test-evidence/**/plant-trace.json
            dependencies.txt
            runtime-revision.txt
            core-revision.txt
            wheel-sha256.txt
