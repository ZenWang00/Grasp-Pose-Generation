[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ssc-runtime"
version = "0.3.0"
description = "Robot-owned offline shared-control coordination"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ssc-core @ git+https://github.com/ZenWang00/semantic-shared-control.git@95d618f567f5f057a1b3f1737cc394a105fa9a4e",
]

[project.optional-dependencies]
test = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssc_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
