[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ssc-runtime"
version = "0.7.0"
description = "Robot-owned offline shared-control coordination"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ssc-core @ git+https://github.com/ZenWang00/semantic-shared-control.git@4dbf12bcab2d7577fd9e477ab28171b7336bd406",
]

[project.optional-dependencies]
test = ["pytest==7.4.4"]

[project.scripts]
ssc-offline = "ssc_runtime.runner:main"

[tool.setuptools.package-data]
ssc_runtime = ["data/*.json", "data/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssc_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
